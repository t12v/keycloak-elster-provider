name: Create release
run-name: ${{ inputs.releaseversion }}
on:
  workflow_dispatch:
    inputs:
      releaseversion:
        description: "Release version"
        required: true
        type: string
        default: "X.Y.Z"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      # Requires repo secrets OSS_SONATYPE_USER / OSS_SONATYPE_PASS (Central Publishing Portal
      # credentials for the de.muenchen.keycloak namespace) - see plan for prerequisites.
      - name: Setup settings.xml
        uses: s4u/maven-settings-action@v4.0.0
        with:
          override: true
          servers: |
            [{
                "id": "central",
                "username": "${{ secrets.OSS_SONATYPE_USER }}",
                "password": "${{ secrets.OSS_SONATYPE_PASS }}"
            }]

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TZ="Europe/Berlin"
          mvn -B -ntp release:prepare release:perform \
            -DreleaseVersion=${{ inputs.releaseversion }} \
            -Darguments="-DskipTests=true -Dmaven.deploy.skip=true"

      # release:perform already built the legacy jar into target/checkout/target - grab it now,
      # before the jakarta builds below clean that same directory.
      - name: Collect legacy (WildFly) SPI jar
        run: cp target/checkout/target/elster-authenticator-${{ inputs.releaseversion }}.jar elster-authenticator-${{ inputs.releaseversion }}.jar

      # release:perform only builds/publishes one artifact per invocation, and the three SPI
      # variants (legacy/jakarta/jakarta-current) can't be compiled together - see CLAUDE.md and
      # pom.xml for the exact Keycloak API generations each one targets. The legacy jar above is
      # the published-to-Central primary artifact; these are GitHub release assets only, built
      # from the same tagged checkout release:perform already produced (`clean` is safe since
      # each prior jar was already collected before the next build). Keep the Keycloak versions
      # here in sync with the keycloak-version-matrix pins in build.yml.
      - name: Build and collect jakarta (Keycloak 22.0.5-25.x) SPI jar
        run: |
          cd target/checkout
          mvn -B -ntp -Pjakarta -Dkeycloak.version=25.0.6 clean package -DskipTests
          cp target/elster-authenticator-${{ inputs.releaseversion }}-jakarta.jar ../../elster-authenticator-${{ inputs.releaseversion }}-jakarta.jar

      - name: Build and collect jakarta-current (Keycloak >= 26.5.0) SPI jar
        run: |
          cd target/checkout
          mvn -B -ntp -Pjakarta-current -Dkeycloak.version=26.7.1 clean package -DskipTests
          cp target/elster-authenticator-${{ inputs.releaseversion }}-jakarta-current.jar ../../elster-authenticator-${{ inputs.releaseversion }}-jakarta-current.jar

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ inputs.releaseversion }} --prepend CHANGELOG.md --unreleased
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Changelog
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): update changelog for v${{ inputs.releaseversion }}"
          git push

      - name: Create GH release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ inputs.releaseversion }}
          tag_name: elster-authenticator-${{ inputs.releaseversion }}
          draft: true
          files: |
            elster-authenticator-${{ inputs.releaseversion }}.jar
            elster-authenticator-${{ inputs.releaseversion }}-jakarta.jar
            elster-authenticator-${{ inputs.releaseversion }}-jakarta-current.jar
