name: CI

env:
    # https://github.com/actions/virtual-environments/issues/1499
    MAVEN_CLI_OPTS: '-ntp --batch-mode --errors --fail-at-end --show-version -Dmaven.wagon.httpconnectionManager.ttlSeconds=60 -Dmaven.wagon.http.retryHandler.count=3 -Dstyle.color=always'

on:
    # allow to manual run the action
    workflow_dispatch: { }
    pull_request: { }
    merge_group: { }
    push:
        branches:
            - develop
        tags:
            - '*'

permissions:
    contents: read
    # For reporting
    attestations: write
    checks: write
    # For Junit Reporting commenting
    pull-requests: write

jobs:
    build:
        name: Build and Test on JDK ${{ matrix.java }} and ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - "macos-latest"
                    - "ubuntu-latest"
                java:
                    - "17"
                    - "21"

        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v6
            -   name: Set up JDK ${{ matrix.java }}
                uses: actions/setup-java@v5
                with:
                    distribution: "temurin"
                    java-version: ${{ matrix.java }}

            -   name: Cache .m2
                uses: actions/cache@v5
                with:
                    path: ~/.m2/repository
                    key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                    restore-keys: |
                        ${{ runner.os }}-maven-

            -   name: Build
                run: |
                    mvn ${MAVEN_CLI_OPTS} clean verify

            -   name: Publish Test Report
                uses: mikepenz/action-junit-report@v6
                if: success() || failure()
                with:
                    summary: true
                    detailed_summary: true
                    annotate_notice: true
                    truncate_stack_traces: false
                    report_paths: '**/target/*-reports/TEST-*.xml'

    build-results:
        name: Build results
        if: ${{ always() }}
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            -   run: exit 1
                # see https://stackoverflow.com/a/67532120/4907315
                if: >-
                    ${{
                          contains(needs.*.result, 'failure')
                      || contains(needs.*.result, 'cancelled')
                          || contains(needs.*.result, 'skipped')
                          }}
